[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "strands-env"
dynamic = ["version"]
description = "A unified framework for building agent environments with Strands Agents."
authors = [{name = "Yuan He", email = "yuanhe.cs.ai@gmail.com"}]
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "strands-sglang>=0.6.0",
    "strands-agents[openai]>=1.46.0",
    "openai",
    "datasets",
    "math-verify>=0.8.0",
    "click>=8.0.0",
    "tqdm>=4.0.0",
    "tiktoken>=0.5.0",
    "python-dotenv",
    "aiolimiter>=1.1.0",
]

[project.urls]
Homepage = "https://github.com/strands-rl/strands-env"
Repository = "https://github.com/strands-rl/strands-env"
Issues = "https://github.com/strands-rl/strands-env/issues"

[project.optional-dependencies]
harbor = [
    "harbor>=0.15.0",
    # Exact pin: `e2b.py` patches an SDK internal. See dependabot.yml's ignore entry.
    "e2b==2.25.1",
]

# PEP 735. Deliberately not `[project.optional-dependencies].dev`: dev tooling is
# not a feature users can install, and it stays out of the published metadata.
[dependency-groups]
dev = [
    "build>=0.10.0",
    "mypy>=1.15.0,<3.0.0",
    "pre-commit",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.0.0",
    "pytest-timeout>=2.0.0",
    "ruff>=0.16.0",
    "twine>=4.0.0",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/strands_env"]

# An allowlist, not an exclude list: hatchling reads the filesystem rather than git,
# so anything untracked but present (.local/, scratch eval runs) would otherwise ship.
[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "LICENSE", "CITATION.cff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 90
filterwarnings = ["error"]
markers = [
    "integration: requires a running SGLang server or live cloud credentials",
]

[tool.coverage.run]
source = ["src/strands_env"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
    "raise NotImplementedError",
    "@(typing\\.)?overload",
    "class .*\\bProtocol\\):",
]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
# A dependency without stubs is named in an override below rather than waved
# through globally, so nothing silently degrades to Any.
ignore_missing_imports = false
follow_untyped_imports = true

# Optional-extra and training-only dependencies that ship no stubs. mypy reports
# unused sections, so a stale entry can't outlive its dependency.
[[tool.mypy.overrides]]
module = ["awm.*", "lm_eval.*", "mlflow.*", "ray.*", "tau2.*", "wandb.*", "weave.*"]
ignore_missing_imports = true

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    "ASYNC",  # flake8-async
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "D2",     # pydocstyle formatting — D1 (must exist) is deliberately not selected
    "D4",     # pydocstyle content
    "E",      # pycodestyle
    "F",      # pyflakes
    "G",      # flake8-logging-format
    "I",      # isort
    "LOG",    # logging
    "N",      # pep8-naming
    "PIE",    # flake8-pie
    "RUF006", # unowned asyncio task — a dropped task loses a rollout silently
    "RUF012", # mutable class attr without ClassVar
    "RUF100", # unused noqa
    "SIM",    # flake8-simplify
    "TRY201", # verbose raise
    "UP",     # pyupgrade
    "W",      # pycodestyle warnings
]
ignore = [
    "E501",
    "UP046",
    "ASYNC109", # `timeout` forwards to a blocking `proc.wait()`
    "ASYNC220", # `Popen(start_new_session=True)` builds the group `killpg` tears down
    "PIE804",   # `extra="allow"` models need `**{...}`; keywords fail mypy
    "SIM115",   # long-lived handle, closed in `close()`/`publish()`
    "SIM117",   # `async with self.semaphore:` is a gate, not a second resource
]

[tool.ruff.lint.per-file-ignores]
"!src/**/*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["strands_env"]
