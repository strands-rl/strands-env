# SHAs, not tags: a tag can be moved to point at new code. Regenerate with
# `pre-commit autoupdate --freeze`.

default_install_hook_types: [pre-commit, commit-msg]

# Downloaded benchmark material: reformatting it changes what we score against.
exclude: ^data/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      # A test file not named test_*.py is silently never collected.
      - id: name-tests-test
        args: [--pytest-test-first]
      - id: requirements-txt-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 65dbdb59d2f2d9c3bdc343c566821ad3319ddaa3 # frozen: v0.16.3
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/crate-ci/typos
    rev: 8a48f81b6c64dcfea44b3633223084c4be58ac5f # frozen: v1.49.0
    hooks:
      - id: typos

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: 4b2e70d08cb2ccd26d1fba73588de41c7a5d50b7 # frozen: v0.25
    hooks:
      - id: validate-pyproject
        additional_dependencies: ["validate-pyproject-schema-store[all]"]
        files: ^pyproject\.toml$

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 6b63472e72e1a91ed8a2f6d483790dfb644fa1d3 # frozen: 0.37.4
    hooks:
      - id: check-github-workflows
      - id: check-dependabot

  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6
    hooks:
      - id: insert-license
        files: ^src/.*\.py$
        args:
          - --license-filepath=.license-header.txt
          - --comment-style=#

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 91ab4bf57e58b32adf1a122681f6ebe164d081c8 # frozen: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: local
    hooks:
      # Project venv, not an isolated one, so stubs match pyproject. pass_filenames
      # is off because mypy needs the whole package to infer correctly.
      - id: mypy
        name: mypy
        entry: .venv/bin/python -m mypy src/strands_env
        language: system
        types: [python]
        pass_filenames: false

      - id: unit-tests
        name: pytest (unit)
        entry: .venv/bin/python -m pytest tests/unit -x -q
        language: system
        types: [python]
        pass_filenames: false
